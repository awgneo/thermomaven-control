[project]
name = "thermomaven-control"
version = "1.6.0"
description = "Home Assistant custom component for ThermoMaven wireless thermometers"
readme = "README.md"
requires-python = ">=3.14.3"
dependencies = [
    "cryptography>=41.0.0",
    "paho-mqtt>=1.6.1",
    "homeassistant>=2026.10.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-homeassistant-custom-component>=0.13.322",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.10",
    # Home Assistant's conversation component, which calling an LLM tool loads, at its manifest's versions
    "gazetteer-matcher==1.1.0",
    "hassil==3.12.1",
    "home-assistant-intents==2026.10.6",
]
